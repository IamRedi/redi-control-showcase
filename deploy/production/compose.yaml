name: redi-control

x-app: &app
  restart: unless-stopped
  env_file:
    - ${REDI_RUNTIME_ENV_FILE:-./runtime.env}
  networks:
    - backend
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: ${REDI_POSTGRES_IMAGE:?Set a reviewed PostgreSQL 17 image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: redi_control
      POSTGRES_USER: redi_control_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redi_control_admin -d redi_control"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: redi-control/migrate:${REDI_VERSION:?Set REDI_VERSION}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.migrate
    restart: "no"
    environment:
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/database_runtime_password
      DATABASE_AUTH_PASSWORD_FILE: /run/secrets/database_auth_password
    secrets:
      - database_admin_url
      - database_runtime_password
      - database_auth_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  identity-bootstrap:
    image: redi-control/api:${REDI_VERSION:?Set REDI_VERSION}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.api
    profiles: ["operator"]
    restart: "no"
    entrypoint: ["node", "packages/identity/dist/bootstrap-cli.js"]
    environment:
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
    secrets:
      - database_admin_url
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  keycloak-db-init:
    image: ${REDI_POSTGRES_IMAGE:?Set a reviewed PostgreSQL 17 image}
    restart: "no"
    user: "${REDI_HOST_UID:-1000}:${REDI_HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "/keycloak-db-init.sh"]
    secrets:
      - database_admin_url
      - identity_database_password
    volumes:
      - ./keycloak-db-init.sh:/keycloak-db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: redi-control/keycloak:${REDI_VERSION:?Set REDI_VERSION}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.keycloak
      args:
        KEYCLOAK_BASE_IMAGE: ${REDI_KEYCLOAK_IMAGE:?Set a reviewed Keycloak image}
    restart: unless-stopped
    user: "${REDI_HOST_UID:-1000}:0"
    entrypoint: ["/bin/bash", "/keycloak-entrypoint.sh"]
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/redi_control
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: redi_control_identity
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /id
      KC_HOSTNAME: https://${REDI_DOMAIN:?Set the exact public domain}/id
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: redi-control-bootstrap
      REDI_PUBLIC_ORIGIN: https://${REDI_DOMAIN:?Set the exact public domain}
    secrets:
      - identity_database_password
      - oidc_client_secret
      - keycloak_bootstrap_admin_secret
    volumes:
      - ./keycloak-entrypoint.sh:/keycloak-entrypoint.sh:ro
      - ./keycloak-realm.json:/opt/keycloak/data/import/redi-control-realm.json:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /opt/keycloak/data:size=256m,mode=0770,uid=${REDI_HOST_UID:-1000},gid=0
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /id/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  clamav:
    image: ${REDI_CLAMAV_IMAGE:?Set a reviewed ClamAV image}
    restart: unless-stopped
    user: clamav
    entrypoint: ["/init-unprivileged"]
    environment:
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav_signatures:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - backend
      - egress
    mem_limit: 4g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'PING\\n' | nc -w 2 127.0.0.1 3310 | grep -qx PONG",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 6m

  openbao:
    image: ${REDI_OPENBAO_IMAGE:?Set a reviewed OpenBao image}
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/openbao-entrypoint.sh"]
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /run/secrets/openbao_ca_cert
    secrets:
      - openbao_ca_cert
      - openbao_tls_cert
      - openbao_tls_key
      - openbao_unseal_key
    volumes:
      - openbao_raft:/openbao/file
      - openbao_audit:/openbao/logs
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./openbao-entrypoint.sh:/openbao-entrypoint.sh:ro
    tmpfs:
      - /run/openbao:mode=0750,size=1m
    networks:
      - backend
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - IPC_LOCK
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    <<: *app
    image: redi-control/api:${REDI_VERSION:?Set REDI_VERSION}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL_FILE: /run/secrets/database_runtime_url
      DATABASE_AUTH_URL_FILE: /run/secrets/database_auth_url
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OIDC_TRANSACTION_ENCRYPTION_KEY_FILE: /run/secrets/oidc_transaction_key
      KEYCLOAK_MEMBER_PROVISIONER_CLIENT_SECRET_FILE: /run/secrets/keycloak_member_provisioner_secret
      SOCIAL_OAUTH_STATE_SECRET_FILE: /run/secrets/social_oauth_state_secret
      META_APP_SECRET_FILE: /run/secrets/meta_app_secret
      OBJECT_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/object_storage_access_key_id
      OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/object_storage_secret_access_key
      OPENBAO_APPROLE_ROLE_ID_FILE: /run/secrets/openbao_approle_role_id
      OPENBAO_APPROLE_SECRET_ID_FILE: /run/secrets/openbao_approle_secret_id
      NODE_EXTRA_CA_CERTS: /run/secrets/openbao_ca_cert
    secrets:
      - database_runtime_url
      - database_auth_url
      - oidc_client_secret
      - oidc_transaction_key
      - keycloak_member_provisioner_secret
      - social_oauth_state_secret
      - meta_app_secret
      - object_storage_access_key_id
      - object_storage_secret_access_key
      - openbao_ca_cert
      - openbao_approle_role_id
      - openbao_approle_secret_id
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      openbao:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health/ingress"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  worker:
    <<: *app
    image: redi-control/worker:${REDI_VERSION:?Set REDI_VERSION}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL_FILE: /run/secrets/database_runtime_url
      WORKER_HEALTH_FILE: /tmp/redi-control-worker-heartbeat
    secrets:
      - database_runtime_url
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    <<: *app
    image: redi-control/web:${REDI_VERSION:?Set REDI_VERSION}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    environment:
      CONTROL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/en"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: ${REDI_CADDY_IMAGE:?Set a reviewed Caddy image}
    restart: unless-stopped
    environment:
      REDI_DOMAIN: ${REDI_DOMAIN:?Set the exact public domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the ACME operator email}
    ports:
      - "${REDI_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${REDI_HTTP_HOST_PORT:-80}:80"
      - "${REDI_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${REDI_HTTPS_HOST_PORT:-443}:443"
      - "${REDI_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${REDI_HTTPS_HOST_PORT:-443}:443/udp"
    volumes:
      - ${REDI_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  frontend:
  egress:
  backend:
    internal: true

volumes:
  postgres_data:
  clamav_signatures:
  openbao_raft:
  openbao_audit:
  caddy_data:
  caddy_config:

secrets:
  postgres_admin_password:
    file: ${REDI_SECRETS_DIR:-./secrets}/postgres_admin_password
  database_admin_url:
    file: ${REDI_SECRETS_DIR:-./secrets}/database_admin_url
  database_runtime_password:
    file: ${REDI_SECRETS_DIR:-./secrets}/database_runtime_password
  database_auth_password:
    file: ${REDI_SECRETS_DIR:-./secrets}/database_auth_password
  database_runtime_url:
    file: ${REDI_SECRETS_DIR:-./secrets}/database_runtime_url
  database_auth_url:
    file: ${REDI_SECRETS_DIR:-./secrets}/database_auth_url
  oidc_client_secret:
    file: ${REDI_SECRETS_DIR:-./secrets}/oidc_client_secret
  identity_database_password:
    file: ${REDI_SECRETS_DIR:-./secrets}/identity_database_password
  keycloak_bootstrap_admin_secret:
    file: ${REDI_SECRETS_DIR:-./secrets}/keycloak_bootstrap_admin_secret
  keycloak_member_provisioner_secret:
    file: ${REDI_SECRETS_DIR:-./secrets}/keycloak_member_provisioner_secret
  oidc_transaction_key:
    file: ${REDI_SECRETS_DIR:-./secrets}/oidc_transaction_key
  social_oauth_state_secret:
    file: ${REDI_SECRETS_DIR:-./secrets}/social_oauth_state_secret
  meta_app_secret:
    file: ${REDI_SECRETS_DIR:-./secrets}/meta_app_secret
  object_storage_access_key_id:
    file: ${REDI_SECRETS_DIR:-./secrets}/object_storage_access_key_id
  object_storage_secret_access_key:
    file: ${REDI_SECRETS_DIR:-./secrets}/object_storage_secret_access_key
  openbao_ca_cert:
    file: ${REDI_SECRETS_DIR:-./secrets}/openbao_ca_cert
  openbao_tls_cert:
    file: ${REDI_SECRETS_DIR:-./secrets}/openbao_tls_cert
  openbao_tls_key:
    file: ${REDI_SECRETS_DIR:-./secrets}/openbao_tls_key
  openbao_unseal_key:
    file: ${REDI_OPENBAO_UNSEAL_KEY_FILE:-./secrets/openbao_unseal_key}
  openbao_approle_role_id:
    file: ${REDI_SECRETS_DIR:-./secrets}/openbao_approle_role_id
  openbao_approle_secret_id:
    file: ${REDI_SECRETS_DIR:-./secrets}/openbao_approle_secret_id
