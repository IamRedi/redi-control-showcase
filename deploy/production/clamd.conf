# REDI CONTROL production ClamAV policy. The daemon is reachable only on the
# internal Docker network; no TCP port is published by Compose.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav

StreamMaxLength 550M
MaxFileSize 550M
MaxScanSize 550M
MaxScanTime 180000
MaxThreads 2
ConcurrentDatabaseReload no
AlertExceedsMax yes
