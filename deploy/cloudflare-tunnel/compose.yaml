name: redi-control-cloudflare-tunnel

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set a reviewed cloudflared image digest}
    restart: unless-stopped
    network_mode: host
    command:
      - tunnel
      - --protocol
      - auto
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./secrets/cloudflare_tunnel_token}
